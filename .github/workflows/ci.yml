name: App checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Checks use disposable databases and mocked provider responses. Never
    # connect this job to the production workspace or paid provider accounts.
    env:
      DATABASE_URL: ""
      SUPABASE_DB_URL: ""
      POSTGRES_URL: ""
      POTSHAVEN_OPENAI_KEY: ""
      OPENAI_API_KEY: ""
      OPS_ARTIFACT_DIR: /tmp/potshaven-checks/operations
      INVENTORY_ARTIFACT_DIR: /tmp/potshaven-checks/inventory
      CONNECTION_ARTIFACT_DIR: /tmp/potshaven-checks/connection
      STUDIO_ARTIFACT_DIR: /tmp/potshaven-checks/studio
    defaults:
      run:
        # Explicit bash keeps pipefail enabled when output is saved with tee.
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
      - name: Prepare diagnostic directory
        run: mkdir -p /tmp/potshaven-checks/logs
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high 2>&1 | tee /tmp/potshaven-checks/logs/dependencies.log
      - name: Install Chromium and system dependencies
        run: npx --no-install playwright install --with-deps chromium
      - name: Build the app
        run: npm run build 2>&1 | tee /tmp/potshaven-checks/logs/build.log
      - name: Test API and storage
        run: npm test 2>&1 | tee /tmp/potshaven-checks/logs/backend.log
      - name: Check production serving and sign-in
        run: npm run test:production 2>&1 | tee /tmp/potshaven-checks/logs/production.log
      - name: Check workflows, recovery and image preparation
        run: npm run test:browser 2>&1 | tee /tmp/potshaven-checks/logs/browser.log
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-check-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/potshaven-checks/
          if-no-files-found: ignore
          retention-days: 7
